services:
  api:
    build:
      target: dev
    environment:
      APP_ENV: development
      DB_ECHO: true
    command:
      - fastapi
      - dev
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    volumes:
      # `:Z` - private SELinux label, `:z` - global
      - ../:/app:z
    working_dir: /app/api
    # Rootless container + Podman. Map UID/GID to make bind-mounted files writable
    user: "1000:1000"
    userns_mode: keep-id
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      s3-init:
        condition: service_completed_successfully

  api-migrate:
    environment:
      APP_ENV: development

  db:
    ports:
      - "127.0.0.1:5432:5432"

  s3:
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  s3-init:
    image: amazon/aws-cli:2.36.24
    entrypoint:
      - /bin/sh
      - /init.sh
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./s3/init.sh:/init.sh:ro
    depends_on:
      s3:
        condition: service_healthy

  web:
    environment:
      # TODO pass as build arguments when building JS bundle
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
    volumes:
      - ../:/app:z
    working_dir: /app/web
    ports:
      - "127.0.0.1:5173:5173"

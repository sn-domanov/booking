name: ${COMPOSE_PROJECT_NAME}

x-api-environment: &api-environment
  SECRET_KEY: ${SECRET_KEY}
  DB__HOST: db
  DB__PORT: 5432
  DB__NAME: ${POSTGRES_DB}
  DB__USER: ${POSTGRES_USER}
  DB__PASSWORD: ${POSTGRES_PASSWORD}
  S3__ACCESS_KEY: ${S3_ACCESS_KEY}
  S3__SECRET_KEY: ${S3_SECRET_KEY}
  S3__ENDPOINT_URL: ${S3_ENDPOINT_URL}
  S3__PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
  S3__REGION: ${S3_REGION}
  S3__BUCKET: ${S3_BUCKET}
  CORS_ORIGINS: ${CORS_ORIGINS}

services:
  api:
    build:
      context: ../api
      target: runtime
    environment: *api-environment
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
      s3:
        condition: service_healthy

  api-migrate:
    build:
      context: ../api
      target: runtime
    command: ["alembic", "upgrade", "head"]
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    
  db:
    image: postgres:18.4-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-test:
    image: postgres:18.4-trixie
    environment:
      POSTGRES_DB: booking_test
      POSTGRES_USER: booking_test
      POSTGRES_PASSWORD: booking_test
    tmpfs:
      - /var/lib/postgresql

  s3:
    image: rustfs/rustfs:1.0.0-rc.2-glibc
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../web
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  rustfs-data:

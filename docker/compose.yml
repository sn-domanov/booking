name: ${COMPOSE_PROJECT_NAME}

services:
  api:
    build:
      context: ../api
      target: runtime
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DB__HOST: db
      DB__PORT: 5432
      DB__NAME: ${POSTGRES_DB}
      DB__USER: ${POSTGRES_USER}
      DB__PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    
  db:
    image: postgres:18.4-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../web
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
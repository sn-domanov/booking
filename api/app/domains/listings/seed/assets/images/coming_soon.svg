<svg viewBox="0 0 1600 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3a67"/>
      <stop offset="45%" stop-color="#5c6f9c"/>
      <stop offset="75%" stop-color="#e8a87c"/>
      <stop offset="100%" stop-color="#f4c99b"/>
    </linearGradient>
    <linearGradient id="buildingA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232946"/>
      <stop offset="100%" stop-color="#161a2e"/>
    </linearGradient>
    <linearGradient id="buildingB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3557"/>
      <stop offset="100%" stop-color="#1b2038"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3d6"/>
      <stop offset="60%" stop-color="#ffd08a"/>
      <stop offset="100%" stop-color="#ffb15c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect x="0" y="0" width="1600" height="1200" fill="url(#sky)"/>

  <!-- Sun glow -->
  <circle cx="1180" cy="430" r="260" fill="url(#sun)"/>
  <circle cx="1180" cy="430" r="90" fill="#fff6e5" opacity="0.95"/>

  <!-- Soft clouds -->
  <g fill="#ffffff" opacity="0.18">
    <ellipse cx="260" cy="220" rx="130" ry="34"/>
    <ellipse cx="360" cy="200" rx="90" ry="26"/>
    <ellipse cx="900" cy="160" rx="110" ry="28"/>
  </g>

  <!-- City skyline (back layer) -->
  <g fill="url(#buildingB)" opacity="0.85">
    <rect x="0" y="650" width="120" height="420"/>
    <rect x="140" y="600" width="90" height="470"/>
    <rect x="250" y="700" width="140" height="370"/>
    <rect x="1250" y="620" width="110" height="450"/>
    <rect x="1380" y="670" width="130" height="400"/>
    <rect x="1500" y="590" width="100" height="480"/>
  </g>

  <!-- City skyline (front layer) -->
  <g fill="url(#buildingA)">
    <rect x="60" y="760" width="160" height="360"/>
    <rect x="230" y="820" width="120" height="300"/>
    <rect x="360" y="740" width="150" height="380"/>
    <rect x="520" y="860" width="130" height="260"/>
    <rect x="660" y="780" width="170" height="340"/>
    <rect x="840" y="840" width="120" height="280"/>
    <rect x="970" y="760" width="150" height="360"/>
    <rect x="1130" y="820" width="120" height="300"/>
    <rect x="1260" y="850" width="140" height="270"/>
    <rect x="1410" y="790" width="150" height="330"/>
  </g>

  <!-- Windows -->
  <g fill="#ffd28a" opacity="0.85">
    <g id="winsA">
      <rect x="80" y="800" width="14" height="20"/><rect x="110" y="800" width="14" height="20"/><rect x="140" y="800" width="14" height="20"/><rect x="170" y="800" width="14" height="20"/>
      <rect x="80" y="840" width="14" height="20"/><rect x="110" y="840" width="14" height="20"/><rect x="140" y="840" width="14" height="20"/><rect x="170" y="840" width="14" height="20"/>
      <rect x="80" y="880" width="14" height="20"/><rect x="110" y="880" width="14" height="20"/><rect x="140" y="880" width="14" height="20"/><rect x="170" y="880" width="14" height="20"/>
      <rect x="80" y="920" width="14" height="20"/><rect x="110" y="920" width="14" height="20"/><rect x="140" y="920" width="14" height="20"/><rect x="170" y="920" width="14" height="20"/>
      <rect x="80" y="960" width="14" height="20"/><rect x="110" y="960" width="14" height="20"/><rect x="140" y="960" width="14" height="20"/><rect x="170" y="960" width="14" height="20"/>
      <rect x="80" y="1000" width="14" height="20"/><rect x="110" y="1000" width="14" height="20"/><rect x="140" y="1000" width="14" height="20"/><rect x="170" y="1000" width="14" height="20"/>
    </g>
    <use href="#winsA" x="290" y="-40"/>
    <use href="#winsA" x="590" y="-20"/>
    <use href="#winsA" x="900" y="0"/>
    <use href="#winsA" x="1180" y="20"/>
    <use href="#winsA" x="1350" y="10"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="1120" width="1600" height="80" fill="#141726"/>

  <!-- Central card panel -->
  <rect x="380" y="500" width="840" height="240" rx="28" fill="url(#cardShadow)" transform="translate(0,18)"/>
  <rect x="380" y="500" width="840" height="240" rx="28" fill="#ffffff" opacity="0.97"/>

  <!-- Camera/image icon (generic, not listing-specific) -->
  <g transform="translate(460,555)">
    <rect x="0" y="20" width="130" height="90" rx="14" fill="#e8a87c"/>
    <rect x="30" y="0" width="70" height="24" rx="6" fill="#e8a87c"/>
    <circle cx="65" cy="65" r="32" fill="#ffffff"/>
    <circle cx="65" cy="65" r="20" fill="#2b3a67"/>
  </g>

  <!-- Text -->
  <text x="640" y="610" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#232946">Coming Soon</text>
  <text x="640" y="665" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#8a93b2">Photos will be added shortly</text>

</svg>

[project]
name = "booking-api"
version = "0.1.0"
description = "Backend API for the booking application"
readme = "../README.md"
requires-python = ">=3.14"

dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-env>=1.7.0",
    "ruff>=0.16.2",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyright]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
env = [
    "APP_ENV=testing",
    "DB__HOST=db-test",
    "DB__NAME=booking_test",
    "DB__USER=booking_test",
    "DB__PASSWORD=booking_test",
]
